  <style>
    :root { color-scheme: dark; --bg:#06111b; --panel:#0b1c2b; --line:rgba(255,255,255,.12); --text:#eaf7ff; --muted:#9db5c6; --cyan:#67e8f9; --gold:#ffd166; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    .shell { height:100%; display:grid; grid-template-rows:auto 1fr; }
    .launcher { position:relative; z-index:2; display:flex; align-items:center; gap:18px; min-height:62px; padding:10px 18px; border-bottom:1px solid var(--line); background:linear-gradient(135deg,rgba(8,28,43,.98),rgba(6,17,27,.96)); box-shadow:0 10px 30px rgba(0,0,0,.24); }
    .brand { display:flex; align-items:center; gap:10px; min-width:max-content; font-weight:850; letter-spacing:.04em; }
    .brand-mark { display:grid; place-items:center; width:34px; height:34px; border:1px solid rgba(103,232,249,.4); border-radius:11px; color:var(--cyan); background:rgba(103,232,249,.1); }
    .levels { display:flex; align-items:center; gap:8px; min-width:0; overflow-x:auto; scrollbar-width:none; }
    .levels::-webkit-scrollbar { display:none; }
    .level { min-width:max-content; border:1px solid var(--line); border-radius:999px; padding:9px 14px; color:var(--muted); background:rgba(255,255,255,.035); font:inherit; font-size:13px; font-weight:750; cursor:pointer; transition:.2s ease; }
    .level:hover { color:var(--text); border-color:rgba(103,232,249,.35); transform:translateY(-1px); }
    .level.active { color:#06202a; border-color:var(--cyan); background:linear-gradient(135deg,var(--cyan),#a5f3fc); box-shadow:0 0 20px rgba(103,232,249,.22); }
    .frame-wrap { position:relative; min-height:0; }
    iframe { display:block; width:100%; height:100%; border:0; background:var(--bg); }
    .loading { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); pointer-events:none; background:var(--bg); transition:opacity .2s ease; }
    .ready .loading { opacity:0; }
    @media (max-width:720px) { .launcher { align-items:flex-start; flex-direction:column; gap:8px; padding:9px 12px; } .levels { width:100%; } .level { padding:8px 12px; } }
  </style>
</head>

      const TITLES = ["割圆", "无理数", "傅里叶", "单位分数"];
      const frame = document.getElementById("gameFrame");
      const frameWrap = document.getElementById("frameWrap");
      const buttons = [...document.querySelectorAll("[data-level]")];
      let currentLevel = 0;

      function decodeBase64(source) {
        const binary = atob(source);
        const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
        return new TextDecoder().decode(bytes);
      }

      function openLevel(level, updateHash = true) {
        const next = Math.max(1, Math.min(4, Number(level) || 1));
        if (next === currentLevel) return;
        currentLevel = next;
        frameWrap.classList.remove("ready");
        frame.title = "数学游戏第" + next + "关：" + TITLES[next - 1];
        buttons.forEach(button => {
          const active = Number(button.dataset.level) === next;
          button.classList.toggle("active", active);
          button.setAttribute("aria-current", active ? "page" : "false");
        });
        frame.srcdoc = decodeBase64(SOURCES[next - 1]);
        if (updateHash) history.replaceState(null, "", "#level-" + next);
      }

      buttons.forEach(button => button.addEventListener("click", () => openLevel(button.dataset.level)));
      frame.addEventListener("load", () => frameWrap.classList.add("ready"));
      window.addEventListener("message", event => {
        if (event.source !== frame.contentWindow || event.data?.type !== "geyuan:navigate") return;
        openLevel(event.data.level);
      });
      window.addEventListener("hashchange", () => {
        const match = location.hash.match(/^#level-([1-4])$/);
        if (match) openLevel(Number(match[1]), false);
      });

      const initial = location.hash.match(/^#level-([1-4])$/);
      openLevel(initial ? Number(initial[1]) : 1, false);
    })();
